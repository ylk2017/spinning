<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>爆旋陀螺物理實驗室 · Beyblade Physics Lab</title>
<style>
:root{
  --paper:#f3f1eb;--card:#fffefa;--ink:#17272e;--muted:#52636a;
  --line:#d3dad7;--blue:#245bc0;--orange:#b85421;--teal:#087969;
  --stage:#14272f;--stage-line:#31464e;--radius:18px;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.55}
button,input,select{font:inherit}
button{cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:9px 15px;transition:background .16s,transform .16s,border-color .16s}
button:hover:not(:disabled){background:#e8ede7;border-color:#879c99}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{cursor:not-allowed;opacity:.48}
:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.primary:hover:not(:disabled){background:#31525e}
.soft{background:#e7eee9}
.selected{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}
header{border-bottom:1px solid var(--line);background:var(--card)}
.shell{width:min(1440px,100%);margin:auto;padding:22px 30px}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:13px}
.brand svg{flex:none}
h1{font-size:clamp(20px,2vw,28px);line-height:1.2;letter-spacing:-.04em;margin:0}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;margin-top:5px}
.header-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
main.shell{padding-top:20px}
.toolbar{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tab{border-color:transparent;background:transparent;display:flex;align-items:center;gap:10px;font-weight:650}
.tab span{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.tab.active{background:var(--ink);color:white}
.mode{display:flex;gap:4px;background:#e4e8e0;border:1px solid var(--line);padding:4px;border-radius:13px}
.mode button{border:0;background:transparent;font-size:13px;min-height:40px}
.question-row{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;margin:8px 0 20px}
.eyebrow{color:var(--teal);font-size:11px;letter-spacing:.13em;font-weight:750;text-transform:uppercase}
h2{font-size:clamp(23px,2.8vw,35px);line-height:1.35;letter-spacing:-.035em;margin:6px 0 8px;max-width:900px}
.question-row p{margin:0;color:var(--muted);font-size:14px}
.status{flex:none;background:#e3eae5;border:1px solid #c6d4cb;border-radius:30px;padding:9px 15px;font-size:13px;margin-top:8px}
.status.running{background:#dceee7;border-color:#9dcab9}
.workbench{display:grid;grid-template-columns:minmax(0,1fr) 325px;gap:20px;align-items:start}
.left,.right{min-width:0}
.stage{background:var(--stage);border:1px solid #243e47;color:#f4f6ed;border-radius:var(--radius);overflow:hidden;position:relative;box-shadow:0 15px 35px #15313a12}
.stage-top,.stage-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 19px;flex-wrap:wrap}
.stage-top{border-bottom:1px solid var(--stage-line);font-size:12px}
.stage-top strong{font-size:13px;font-weight:600}
.stage-tag{color:#b8d1d3;font-size:11px;letter-spacing:.06em}
.stage-bottom{border-top:1px solid var(--stage-line);font-size:12px;color:#c3d3d5}
canvas{display:block;width:100%}
#scene{height:350px}
.readouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--stage-line);border-top:1px solid var(--stage-line)}
.readout{background:#1b3038;padding:15px 18px;min-width:0}
.readout label{display:block;font-size:12px;color:#b7cbcf;margin-bottom:5px}
.readout .value{font-size:clamp(18px,2vw,27px);font-variant-numeric:tabular-nums;letter-spacing:-.045em;line-height:1.25;overflow-wrap:anywhere}
.readout .unit{font-size:11px;color:#b7cbcf;margin-top:5px}
.readout.a .value{color:#a7c9ff}
.readout.b .value{color:#ffcaa4}
.readout.l .value{color:#83ddca}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h3{font-size:15px;margin:0 0 12px;letter-spacing:-.015em}
.step-title{display:flex;align-items:center;gap:9px}
.step-number{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#e7ece5;font-size:12px}
.note{font-size:12px;color:var(--muted);margin:9px 0;line-height:1.65}
.predict-options{display:grid;gap:7px}
.predict-options button{text-align:left;font-size:14px}
.predict-options button[aria-pressed=true]{border:2px solid var(--teal);background:#e6f1ea;padding:8px 14px}
.saved{font-size:12px;color:var(--teal);margin:10px 0 0}
.controls{display:grid;gap:16px}
.control{min-width:0}
.control-label{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:13px;margin-bottom:5px}
.control-label output{font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
input[type=range]{width:100%;height:44px;accent-color:var(--teal);margin:0;cursor:pointer}
input[type=range]:disabled{opacity:.45;cursor:not-allowed}
.control-hint{font-size:11px;color:var(--muted);margin-top:-4px}
.control-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.control-actions .wide{grid-column:1/-1}
.inline-actions{display:flex;gap:8px;flex-wrap:wrap}
.inline-actions button{flex:1;font-size:13px;padding:8px}
.plot-card{padding:18px;margin-top:18px}
.plot-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.plot-header h3{margin:0}
.plot-header span{font-size:11px;color:var(--muted)}
.plot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.plot-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.plot{min-width:0}
.plot canvas{height:190px}
.plot.single canvas{height:245px}
.plot-name{font-size:12px;margin:0 0 5px;color:var(--muted)}
.learn-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:2px}
.learn-grid .card{margin-bottom:0}
details{font-size:13px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:10px;font-weight:650;list-style:none}
summary::before{content:"+";font-size:19px;color:var(--teal);flex:none}
details[open]>summary::before{content:"−"}
details p{margin:8px 0 12px}
.equation{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#edf1e9;padding:12px;border-radius:9px;overflow-wrap:anywhere;font-size:13px}
.exit-options{display:grid;gap:7px;margin-top:12px}
.exit-options button{font-size:13px;text-align:left}
.feedback{font-size:13px;border-left:3px solid var(--teal);padding-left:12px;margin:12px 0 0}
.model{margin-top:20px;font-size:12px;color:var(--muted)}
.model details{border-top:1px solid var(--line);padding-top:10px}
.model-columns{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.model ul{padding-left:18px}
footer{display:flex;justify-content:space-between;gap:15px;margin-top:22px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:15px;flex-wrap:wrap}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
body.presentation .secondary{display:none}
body.presentation .shell{width:min(1600px,100%);padding:16px 24px}
body.presentation #scene{height:400px}
body.presentation .readout .value{font-size:clamp(24px,3vw,42px)}
body.presentation .workbench{grid-template-columns:minmax(0,1fr) 340px}
body.presentation .plot canvas{height:160px}
body.presentation .question-row{margin-bottom:12px}
body.presentation h2{font-size:clamp(26px,3vw,42px)}
@media(max-width:1050px){
  .workbench,body.presentation .workbench{grid-template-columns:minmax(0,1fr) 290px}
  .shell{padding:20px}
  .plot-grid{grid-template-columns:1fr}
  .plot canvas{height:165px}
}
@media(max-width:760px){
  .shell,body.presentation .shell{padding:15px}
  .top{align-items:flex-start;flex-wrap:wrap}
  .header-tools{justify-content:flex-start}
  .brand small{font-size:10px}
  .toolbar{gap:12px}
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:4px}
  .tab{font-size:12px;padding:9px 7px;gap:6px;justify-content:center}
  .question-row{display:block}
  .status{display:inline-block;margin-top:12px}
  .workbench,body.presentation .workbench{grid-template-columns:1fr}
  #scene,body.presentation #scene{height:300px}
  .readout{padding:12px}
  .readout .value{font-size:19px}
  .learn-grid,.model-columns,.plot-grid.two{grid-template-columns:1fr}
  .right{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  .right .card{margin-bottom:0}
  .card{padding:16px}
}
@media(max-width:480px){
  .right{grid-template-columns:1fr}
  .readouts{grid-template-columns:repeat(2,minmax(0,1fr))}
  #scene,body.presentation #scene{height:275px}
  .mode{width:100%}
  .mode button{flex:1}
  .stage-top,.stage-bottom{padding:12px}
  h1{font-size:21px}
  .header-tools button{font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header>
  <div class="shell top">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="#17272e"/>
        <circle cx="20" cy="20" r="11" fill="none" stroke="#8bc8b7" stroke-width="1"/>
        <path d="M9 20H31" stroke="#f3f1eb" stroke-width="2"/>
        <circle cx="10" cy="20" r="3" fill="#8bc8b7"/>
        <circle cx="30" cy="20" r="3" fill="#8bc8b7"/>
        <circle cx="20" cy="20" r="3" fill="#f3f1eb"/>
      </svg>
      <div><h1 id="brand-title"></h1><small id="brand-sub"></small></div>
    </div>
    <div class="header-tools">
      <button id="language" data-action="language"></button>
      <button id="presentation" data-action="presentation" aria-pressed="false"></button>
    </div>
  </div>
</header>
<main class="shell">
  <div class="toolbar">
    <nav class="tabs" id="tabs" aria-label="實驗選擇"></nav>
    <div class="mode" role="group" id="mode-group" aria-label="教學模式">
      <button data-action="guided" id="guided"></button>
      <button data-action="explore" id="explore"></button>
    </div>
  </div>
  <section aria-labelledby="question">
    <div class="question-row">
      <div>
        <div class="eyebrow" id="eyebrow"></div>
        <h2 id="question"></h2>
        <p id="context"></p>
      </div>
      <div class="status" id="status"></div>
    </div>
    <div class="workbench">
      <div class="left">
        <section class="stage" id="stage" aria-label="模擬舞台">
          <div class="stage-top">
            <strong id="stage-title"></strong>
            <span class="stage-tag" id="ideal-tag"></span>
          </div>
          <canvas id="scene" role="img" aria-describedby="scene-description"></canvas>
          <p id="scene-description" class="sr-only"></p>
          <div class="readouts" id="readouts"></div>
          <div class="stage-bottom">
            <span id="clock"></span>
            <span id="slow-label"></span>
          </div>
        </section>
        <section class="card plot-card" aria-labelledby="plot-title">
          <div class="plot-header">
            <h3 id="plot-title"></h3>
            <span id="plot-note"></span>
          </div>
          <div id="plots"></div>
        </section>
      </div>
      <aside class="right" aria-label="實驗操作">
        <section class="card" id="prediction-card"></section>
        <section class="card" id="controls-card"></section>
      </aside>
    </div>
    <div class="learn-grid secondary">
      <section class="card" id="observation-card"></section>
      <section class="card" id="exit-card"></section>
    </div>
  </section>
  <section class="model secondary" id="model"></section>
  <footer>
    <span id="footer-left"></span>
    <span id="footer-right"></span>
  </footer>
</main>
<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

let lang="zh", mode="guided", active=0, presentation=false;
const tr=(key,args={})=>{
  let out=I18N[lang][key];
  if(typeof out!=="string")return out;
  return out.replace(/\{(\w+)\}/g,(_,k)=>args[k]??"");
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);

/* ---------- Pure physics ---------- */
const TAU=2*Math.PI;
const gToKg=x=>x/1000;
const cmToM=x=>x/100;
const revToRad=x=>TAU*x;
const radToRev=x=>x/TAU;
const moment=(r,M=CONFIG.hubMass,R=CONFIG.hubRadius,m=CONFIG.weightMass)=>0.5*M*R*R+2*m*r*r;
const totalMass=()=>CONFIG.hubMass+2*CONFIG.weightMass;
const angularSpeed=(L,I)=>L/I;
const rotationalEnergy=(I,w)=>0.5*I*w*w;
const stopTime=(I,w,tau)=>tau>0?I*Math.max(0,w)/tau:Infinity;
const momentumAt=(L,tau,dt)=>Math.max(0,L-Math.max(0,tau)*Math.max(0,dt));
const wrapAngle=a=>((a%TAU)+TAU)%TAU;
const smooth=x=>x*x*(3-2*x);

function brakeSegment(L,I,tau,dt){
  const used=tau>0?Math.min(dt,Math.max(0,L)/tau):dt;
  const next=momentumAt(L,tau,dt);
  const angle=(Math.max(0,L)*used-0.5*tau*used*used)/I;
  return {L:next,w:next/I,angle,used};
}
function radiusAtMove(move,dt){
  const elapsed=Math.min(CONFIG.moveDuration,move.elapsed+dt);
  const r=move.from+(move.to-move.from)*smooth(elapsed/CONFIG.moveDuration);
  return {r,elapsed,done:elapsed>=CONFIG.moveDuration};
}
function conserveSegment(L,r,move,dt){
  if(!move)return {r,w:L/moment(r),angle:L/moment(r)*dt,move:null};
  const part=radiusAtMove(move,dt);
  const half=radiusAtMove(move,dt/2);
  const w0=L/moment(r),wm=L/moment(half.r),w1=L/moment(part.r);
  return {
    r:part.r,w:w1,angle:dt*(w0+4*wm+w1)/6,
    move:part.done?null:{...move,elapsed:part.elapsed}
  };
}

/* ---------- Independent experiment states ---------- */
function makeState(id,params,round=1,records=[]){
  const p={...params};
  return {
    id,p,round,records,prediction:null,quiz:null,quizMode:null,
    launched:false,observed:false,status:"ready",t:0,ticks:0,
    theta:[0,0],visual:[0,0],history:[],scales:null,
    r:id===0?null:p.r,target:id===1?p.r:null,move:null,
    L:0,L0:0,w:0,wA:0,wB:0,stops:[null,null]
  };
}
const states=[
  makeState(0,CONFIG.defaults.compare),
  makeState(1,CONFIG.defaults.conserve),
  makeState(2,CONFIG.defaults.brake)
];
const current=()=>states[active];

function initialise(s){
  s.launched=true;s.status="running";s.t=0;s.ticks=0;
  s.theta=[0,0];s.visual=[0,0];s.history=[];s.stops=[null,null];
  const w0=revToRad(s.p.speed);
  if(s.id===0){
    s.wA=w0;s.wB=w0;
    s.scales={speed:s.p.speed*1.12};
  }else{
    s.r=s.p.r;s.w=w0;s.L=s.L0=moment(s.r)*w0;
    if(s.id===1){
      s.target=s.r;s.move=null;
      s.scales={
        inertia:moment(cmToM(CONFIG.radius.max))*1.12,
        speed:radToRev(s.L/moment(cmToM(CONFIG.radius.min)))*1.12,
        momentum:s.L0*1.2
      };
    }else{
      s.scales={speed:s.p.speed*1.12,momentum:s.L0*1.2};
    }
  }
  appendSample(s);
}

function sampleValues(s,time=s.t){
  if(s.id===0){
    const w0=revToRad(s.p.speed);
    return {
      t:time,
      speedA:radToRev(Math.max(0,w0-s.p.torque*time/moment(s.p.rA))),
      speedB:radToRev(Math.max(0,w0-s.p.torque*time/moment(s.p.rB)))
    };
  }
  return {t:time,inertia:moment(s.r),speed:radToRev(s.w),momentum:s.L};
}
function appendSample(s,time=s.t){
  const v=sampleValues(s,time),last=s.history[s.history.length-1];
  if(last&&Math.abs(last.t-time)<CONFIG.epsilon)s.history[s.history.length-1]=v;
  else s.history.push(v);
  if(s.history.length>CONFIG.maxSamples)s.history.splice(0,s.history.length-CONFIG.maxSamples);
}
function rotateState(s,index,angle){
  s.theta[index]=wrapAngle(s.theta[index]+angle);
  s.visual[index]=wrapAngle(s.visual[index]+angle*CONFIG.visualRate);
}
function advanceSimulation(s,dt){
  if(s.status!=="running"||!s.launched)return;
  const before=s.t;
  let h=dt;
  if(s.id===0){
    const stopA=stopTime(moment(s.p.rA),revToRad(s.p.speed),s.p.torque);
    const stopB=stopTime(moment(s.p.rB),revToRad(s.p.speed),s.p.torque);
    const end=Math.max(stopA,stopB);
    h=Math.min(dt,Math.max(0,end-before));
    const a=brakeSegment(moment(s.p.rA)*s.wA,moment(s.p.rA),s.p.torque,h);
    const b=brakeSegment(moment(s.p.rB)*s.wB,moment(s.p.rB),s.p.torque,h);
    s.wA=a.w;s.wB=b.w;
    rotateState(s,0,a.angle);rotateState(s,1,b.angle);
    s.t=before+h;
    const events=[];
    [stopA,stopB].forEach((at,i)=>{
      if(s.stops[i]===null&&at<=s.t+CONFIG.epsilon){
        s.stops[i]=at;events.push(at);
        if(i===0)s.wA=0;else s.wB=0;
      }
    });
    events.sort((a,b)=>a-b).forEach(at=>appendSample(s,at));
    if(s.t>=end-CONFIG.epsilon){
      s.t=end;s.wA=0;s.wB=0;s.status="complete";
    }
  }else if(s.id===1){
    const next=conserveSegment(s.L0,s.r,s.move,h);
    s.r=next.r;s.w=next.w;s.L=s.L0;s.move=next.move;
    rotateState(s,0,next.angle);
    s.t+=h;
  }else{
    const tau=s.p.brake?s.p.torque:0;
    const seg=brakeSegment(s.L,moment(s.r),tau,h);
    if(tau>0&&s.L>0&&seg.L===0)h=seg.used;
    s.L=seg.L;s.w=seg.w;
    rotateState(s,0,seg.angle);
    s.t+=h;
    if(s.L===0)s.status="complete";
  }
  s.ticks++;
  if(s.t>=CONFIG.observeAfter)s.observed=true;
  if(s.ticks%CONFIG.sampleEverySteps===0||s.status==="complete")appendSample(s);
}
function setWeightTarget(s,target){
  target=Math.min(cmToM(CONFIG.radius.max),Math.max(cmToM(CONFIG.radius.min),target));
  s.target=target;
  if(!s.launched){s.r=target;s.p.r=target;return;}
  if(Math.abs(target-s.r)<CONFIG.epsilon){s.move=null;return;}
  s.move={from:s.r,to:target,elapsed:0};
}
function resetState(id,defaults=false){
  const old=states[id];
  const progressed=old.launched||old.prediction!==null||defaults;
  states[id]=makeState(id,defaults?CONFIG.defaults[["compare","conserve","brake"][id]]:old.p,
    old.round+(progressed?1:0),old.records);
}
function changeInitial(s,key,value){
  if(s.p[key]===value)return;
  const id=s.id,hadRound=s.launched||s.prediction!==null;
  const p={...s.p,[key]:value};
  states[id]=makeState(id,p,s.round+(hadRound?1:0),s.records);
  if(hadRound)announce(tr("announceNew"));
}
function canStart(s){
  return s.status==="paused"||(s.status==="ready"&&(mode==="explore"||s.prediction!==null));
}
function pauseCurrent(){
  const s=current();
  if(s.status==="running"){s.status="paused";accumulator=0;return true;}
  return false;
}

/* ---------- Formatting ---------- */
function scientific(x,digits=2){
  if(!Number.isFinite(x))return "—";
  if(x===0)return "0";
  const exponent=Math.floor(Math.log10(Math.abs(x)));
  const mantissa=(x/10**exponent).toFixed(digits);
  const superDigits={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
  return `${mantissa} × 10${String(exponent).split("").map(c=>superDigits[c]).join("")}`;
}
const fixed=(x,n=2)=>Number.isFinite(x)?x.toFixed(n):"—";
function announce(message){$("live").textContent=message;}
function displayState(s){
  if(s.status==="ready")return s.prediction!==null?"ready":mode==="guided"?"unpredicted":"exploreReady";
  return s.status;
}
function readout(key,label,unit,style=""){
  return `<div class="readout ${style}"><label>${esc(label)}</label><div class="value" data-read="${key}">—</div><div class="unit">${esc(unit)}</div></div>`;
}
function slider(key,label,min,max,step,value,unit){

}

      <button data-action="reset">${esc(tr("reset"))}</button>
      <button data-action="defaults">${esc(tr("defaults"))}</button>
      <button data-action="edit" id="edit" class="wide soft">${esc(tr("resetEdit"))}</button>

  $("plot-title").textContent=tr("plots");
  const plotDefs=id===0?[["compare","chartSpeed"]]:id===1?

  $("plots").innerHTML=plotDefs.map(([key,name])=>`<div class="plot ${plotDefs.length===1?"single":""}"><p class="plot-name">${esc(tr(name))}</p><canvas data-chart="${key}" role="img" aria-label="${esc(tr("chartAria",{name:tr(name)}))}"></canvas></div>`).join("");
  $("observation-card").innerHTML=`

        <p class="note">${esc(d.limits[id])}</p>

  $("model").innerHTML=`
    <details><summary>${esc(tr("modelTitle"))}</summary>

        <div><div class="equation">I_hub = ½MR²<br>I = I_hub + 2mr²<br>L = Iω<br>K_rot = ½Iω²</div><p>${esc(tr("symbols"))}</p><p>${esc(tr("units"))}</p></div>
      </div>

  $("footer-left").textContent=tr("footerLeft");$("footer-right").textContent=tr("footerRight");

function syncUI(){
  const s=current(),d=I18N[lang],id=s.id;
  $("status").textContent=tr("round",{n:s.round})+" · "+d.states[displayState(s)];
  $("status").classList.toggle("running",s.status==="running");
  $("clock").textContent=tr("time",{t:fixed(s.t,2)});
  const predictions=document.querySelectorAll('[data-action="predict"]');
  predictions.forEach((btn,i)=>{
    btn.disabled=mode==="explore"||s.prediction!==null||s.launched;
    btn.setAttribute("aria-pressed",String(s.prediction===i));
  });
  $("prediction-hint").textContent=mode==="explore"?tr("exploreHint"):s.prediction===null?tr("noPrediction"):tr("predictionHint");
  $("prediction-saved").textContent=s.prediction===null?"":tr("predictionSaved",{answer:d.predictions[id][s.prediction]});
  $("play").textContent=s.status==="running"?tr("pause"):s.status==="paused"?tr("resume"):tr(id===0?"start":"launch");
  $("play").disabled=s.status!=="running"&&!canStart(s);
  $("edit").hidden=!s.launched;
  $("lock-note").textContent=s.launched?tr(id===0?"lock":"launchLock"):"";
  document.querySelectorAll("[data-input]").forEach(input=>{
    const key=input.dataset.input;
    input.disabled=s.launched&&!(id===1&&key==="target")&&!(id===2&&key==="torque");
    const v=Number(input.value);
    const unit=["r","rA","rB","target"].includes(key)?"cm":key==="speed"?"rev/s":"N·m";
    const text=(key==="torque"?scientific(v):fixed(v,key==="speed"?1:1))+" "+unit;
    $("output-"+key).textContent=text;
    input.setAttribute("aria-valuetext",text);
  });
  if(id===1){
    $("target-hint").textContent=tr(s.status==="paused"?"pausedTarget":"targetHint");
  }
  if(id===2){
    $("brake-toggle").textContent=tr(s.p.brake?"brakeOn":"brakeOff");
    $("brake-toggle").setAttribute("aria-pressed",String(s.p.brake));
    $("brake-hint").textContent=tr(s.status==="complete"?"relaunchHint":"brakeHint");
  }
  const values={mass:fixed(totalMass()*1000,0)};
  if(id===0){
    values.wA=fixed(s.launched?radToRev(s.wA):s.p.speed);
    values.wB=fixed(s.launched?radToRev(s.wB):s.p.speed);
    values.iA=scientific(moment(s.p.rA));values.iB=scientific(moment(s.p.rB));
    values.stops=s.stops.map(v=>v===null?"—":fixed(v,2)).join(" / ");
  }else{
    values.i=scientific(moment(s.r));
    values.w=fixed(s.launched?radToRev(s.w):s.p.speed);
    values.L=scientific(s.launched?s.L:moment(s.r)*revToRad(s.p.speed));
    values.r=fixed(s.r*100,2);
    values.tau=id===1||!s.p.brake?"0":"−"+scientific(s.p.torque);
  }
  document.querySelectorAll("[data-read]").forEach(el=>{
    const value=values[el.dataset.read]??"—";
    if(el.textContent!==value)el.textContent=value;
  });
  $("evidence-wait").hidden=s.observed;
  $("explanation").hidden=!s.observed;
  document.querySelectorAll('[data-action="quiz"]').forEach((btn,i)=>{
    btn.disabled=!s.observed;
    btn.classList.toggle("selected",s.quiz===i);
    btn.setAttribute("aria-pressed",String(s.quiz===i));
  });
  $("quiz-feedback").hidden=s.quiz===null;
  if(s.quiz!==null){
    $("quiz-feedback").textContent=(s.quizMode==="explore"?tr("exploreAnswer")+" ":"")+tr(s.quiz===0?"good":"tryAgain");
  }
  $("plot-note").textContent=s.t>CONFIG.chartWindow?
    tr("plotRolling",{n:CONFIG.chartWindow}):tr("plotNote");
}

/* ---------- Canvas sizing ---------- */
let resizeObserver=null;
function prepareCanvas(canvas){
  const rect=canvas.getBoundingClientRect();
  const w=Math.max(1,rect.width),h=Math.max(1,rect.height);
  const dpr=Math.min(CONFIG.maxDPR,window.devicePixelRatio||1);
  const pw=Math.round(w*dpr),ph=Math.round(h*dpr);
  if(canvas.width!==pw||canvas.height!==ph){canvas.width=pw;canvas.height=ph;}
  const ctx=canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return {ctx,w,h};
}
function connectResizeObservers(){
  if(resizeObserver)resizeObserver.disconnect();
  if(typeof ResizeObserver!=="undefined"){
    if(!resizeObserver)resizeObserver=new ResizeObserver(()=>renderGraphics());
    document.querySelectorAll("canvas").forEach(c=>resizeObserver.observe(c));
  }
}
function text(ctx,value,x,y,size=12,color="#c1d4d7",align="left"){
  ctx.fillStyle=color;ctx.font=`${size}px ${CONFIG.font||"system-ui, sans-serif"}`;
  ctx.textAlign=align;ctx.fillText(value,x,y);
}
function arrow(ctx,cx,cy,r,color){
  const start=-0.20,end=-1.35;
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  ctx.beginPath();ctx.arc(cx,cy,r,start,end,true);ctx.stroke();
  const x=cx+r*Math.cos(end),y=cy+r*Math.sin(end);
  const a=end-Math.PI/2;
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y);
  ctx.lineTo(x-9*Math.cos(a-.45),y-9*Math.sin(a-.45));
  ctx.lineTo(x-9*Math.cos(a+.45),y-9*Math.sin(a+.45));ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawRotor(ctx,cx,cy,size,r,angle,color,w,braking){
  const scale=size/cmToM(CONFIG.radius.max);
  const hub=CONFIG.hubRadius*scale,rr=r*scale;
  ctx.save();
  ctx.strokeStyle="#35505a";ctx.lineWidth=1;
  for(let i=1;i<=3;i++){
    ctx.setLineDash(i===3?[]:[2,5]);
    ctx.beginPath();ctx.arc(cx,cy,size*i/3,0,TAU);ctx.stroke();
  }
  ctx.setLineDash([]);
  for(let i=0;i<48;i++){
    const a=i*TAU/48,major=i%4===0;
    ctx.strokeStyle=major?"#67818a":"#3b535c";
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*(size+5),cy+Math.sin(a)*(size+5));
    ctx.lineTo(cx+Math.cos(a)*(size+(major?13:9)),cy+Math.sin(a)*(size+(major?13:9)));ctx.stroke();
  }
  ctx.strokeStyle="#29424d";ctx.beginPath();ctx.moveTo(cx-size-18,cy);ctx.lineTo(cx+size+18,cy);ctx.moveTo(cx,cy-size-18);ctx.lineTo(cx,cy+size+18);ctx.stroke();
  arrow(ctx,cx,cy,size+23,"#9ed6c9");
  if(braking&&w>0){
    ctx.strokeStyle="#efb080";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,size+31,1.0,2.0);ctx.stroke();
    const a=2,x=cx+(size+31)*Math.cos(a),y=cy+(size+31)*Math.sin(a);
    ctx.fillStyle="#efb080";ctx.beginPath();ctx.moveTo(x,y);
    ctx.lineTo(x+2,y+10);ctx.lineTo(x+10,y+3);ctx.closePath();ctx.fill();
  }
  ctx.translate(cx,cy);
  ctx.rotate(-angle);
  const gradient=ctx.createRadialGradient(-hub*.3,-hub*.4,2,0,0,hub);
  gradient.addColorStop(0,"#728b94");gradient.addColorStop(.65,"#425d67");gradient.addColorStop(1,"#273d48");
  ctx.fillStyle=gradient;ctx.strokeStyle="#8aa2aa";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(0,0,hub,0,TAU);ctx.fill();ctx.stroke();
  ctx.strokeStyle="#9eb4b9";ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(0,0,hub*.75,0,TAU);ctx.stroke();
  ctx.lineWidth=7;ctx.strokeStyle="#0b1b23";
  ctx.beginPath();ctx.moveTo(-size,0);ctx.lineTo(size,0);ctx.stroke();
  ctx.lineWidth=2;ctx.strokeStyle="#68838d";ctx.stroke();
  for(let i=-1;i<=1;i+=2){
    ctx.fillStyle="#91b8bd";
    for(let j=1;j<=6;j++){ctx.fillRect(i*size*j/6-1,-5,2,10);}
    const wx=i*rr;
    ctx.shadowColor="#0008";ctx.shadowBlur=9;ctx.shadowOffsetY=4;
    ctx.fillStyle=color;ctx.strokeStyle="#f6f9f2";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(wx,0,Math.max(7,size*.10),0,TAU);ctx.fill();ctx.stroke();
    ctx.shadowBlur=0;ctx.shadowOffsetY=0;
    ctx.fillStyle="#11262c";ctx.beginPath();ctx.arc(wx,0,2.5,0,TAU);ctx.fill();
    ctx.strokeStyle="#d9ebdc";ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(0,14);ctx.lineTo(wx,14);ctx.stroke();ctx.setLineDash([]);
  }
  ctx.fillStyle="#e4ebe3";ctx.beginPath();ctx.arc(0,0,6,0,TAU);ctx.fill();
  ctx.fillStyle="#233c46";ctx.beginPath();ctx.arc(0,0,2,0,TAU);ctx.fill();
  ctx.restore();
}
function renderScene(){
  const canvas=$("scene");
  if(!canvas)return;
  const {ctx,w,h}=prepareCanvas(canvas),s=current();
  const bg=ctx.createLinearGradient(0,0,w,h);
  bg.addColorStop(0,"#1c343d");bg.addColorStop(1,"#10222b");
  ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
  ctx.fillStyle="#789198";
  for(let x=20;x<w;x+=32)for(let y=20;y<h;y+=32)ctx.fillRect(x,y,.7,.7);
  if(s.id===0){
    const size=Math.min(w*.175,h*.29),cy=h*.53;
    ctx.strokeStyle="#35505a";ctx.beginPath();ctx.moveTo(w/2,45);ctx.lineTo(w/2,h-30);ctx.stroke();
    [0,1].forEach(i=>{
      const x=w*(i===0?.25:.75),r=i===0?s.p.rA:s.p.rB;
      const speed=s.launched?(i===0?s.wA:s.wB):0;
      drawRotor(ctx,x,cy,size,r,s.visual[i],i===0?"#8dbaff":"#f4ae78",speed,s.launched);
      text(ctx,tr(i===0?"deviceA":"deviceB"),x,26,14,i===0?"#afd0ff":"#ffd0a9","center");
      text(ctx,`r = ${fixed(r*100,1)} cm`,x,h-22,12,"#d1dee0","center");
    });
    text(ctx,tr("sameMass",{m:fixed(totalMass()*1000,0)}),w/2,48,w<450?10:12,"#c5d6d6","center");
  }else{
    const size=Math.min(w*.28,h*.31);
    drawRotor(ctx,w/2,h*.53,size,s.r,s.visual[0],"#96d3c0",
      s.launched?s.w:0,s.id===2&&s.p.brake&&s.launched);
    text(ctx,s.id===1?tr("noTorque"):tr(s.p.brake?"brakeMode":"idealMode"),w/2,27,w<450?12:14,"#d1e4df","center");
    text(ctx,s.id===1?tr(s.move?"moving":"holding"):tr("holding"),w/2,h-22,12,"#bbd2d6","center");
  }
  text(ctx,tr("rotation"),15,h-7,10,"#a6c8c6");
}

/* ---------- Charts: bounded real model history ---------- */
function axisNumber(value,key){
  if(value===0)return "0";
  return key==="inertia"||key==="momentum"?value.toExponential(1):fixed(value,value<10?1:0);
}
function renderChart(canvas){
  const {ctx,w,h}=prepareCanvas(canvas),s=current(),key=canvas.dataset.chart;
  const left=w<300?58:66,right=13,top=31,bottom=42;
  const gw=Math.max(1,w-left-right),gh=Math.max(1,h-top-bottom);
  const tMax=Math.max(CONFIG.chartInitialWindow,s.t);
  const tMin=Math.max(0,tMax-CONFIG.chartWindow);
  let ymax,unit,series;
  if(key==="compare"){
    ymax=s.scales?.speed||s.p.speed*1.12;unit=tr("speedAxis");
    series=[{key:"speedA",color:"#245bc0",dash:[],label:tr("legendA")},
      {key:"speedB",color:"#b85421",dash:[6,4],label:tr("legendB")}];
  }else{
    ymax=s.scales?.[key]||(key==="inertia"?moment(cmToM(CONFIG.radius.max))*1.12:
      key==="momentum"?moment(s.r)*revToRad(s.p.speed)*1.2:
      s.id===1?radToRev(moment(s.r)*revToRad(s.p.speed)/moment(cmToM(CONFIG.radius.min)))*1.12:s.p.speed*1.12);
    unit=tr(key==="inertia"?"iAxis":key==="momentum"?"lAxis":"speedAxis");
    series=[{key,color:key==="inertia"?"#245bc0":key==="momentum"?"#087969":"#b85421",dash:[],label:""}];
  }
  text(ctx,unit,left,14,10,"#52636a");
  if(key==="compare"){
    text(ctx,tr("legendA"),w-96,14,11,"#245bc0");
    text(ctx,tr("legendB"),w-48,14,11,"#b85421");
  }
  for(let i=0;i<=4;i++){
    const y=top+gh*i/4,val=ymax*(1-i/4);
    ctx.strokeStyle="#e0e5df";ctx.lineWidth=1;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(left+gw,y);ctx.stroke();
    text(ctx,axisNumber(val,key),left-8,y+3,9,"#52636a","right");
  }
  for(let i=0;i<=4;i++){
    const x=left+gw*i/4,val=tMin+(tMax-tMin)*i/4;
    text(ctx,fixed(val,0),x,top+gh+17,10,"#52636a","center");
  }
  text(ctx,tr("timeAxis"),left+gw/2,h-5,10,"#52636a","center");
  ctx.strokeStyle="#91a39c";ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left,top+gh);ctx.lineTo(left+gw,top+gh);ctx.stroke();
  if(!s.history.length){
    text(ctx,tr("emptyGraph"),left+gw/2,top+gh/2,11,"#52636a","center");return;
  }
  ctx.save();ctx.beginPath();ctx.rect(left,top,gw,gh);ctx.clip();
  for(const line of series){
    ctx.strokeStyle=line.color;ctx.lineWidth=2.25;ctx.setLineDash(line.dash);ctx.beginPath();
    let begun=false;
    for(let i=0;i<s.history.length;i++){
      const p=s.history[i];
      if(p.t<tMin&&i+1<s.history.length&&s.history[i+1].t<tMin)continue;
      const x=left+(p.t-tMin)/(tMax-tMin)*gw;
      const y=top+gh-Math.max(0,p[line.key])/ymax*gh;
      if(!begun){ctx.moveTo(x,y);begun=true;}else ctx.lineTo(x,y);
    }
    ctx.stroke();
    const last=s.history[s.history.length-1];
    if(last.t>=tMin){
      ctx.setLineDash([]);ctx.fillStyle=line.color;
      ctx.beginPath();ctx.arc(left+(last.t-tMin)/(tMax-tMin)*gw,top+gh-Math.max(0,last[line.key])/ymax*gh,2.7,0,TAU);ctx.fill();
    }
  }
  ctx.restore();
}
function renderGraphics(){
  renderScene();
  document.querySelectorAll("[data-chart]").forEach(renderChart);
}

/* ---------- Input and teaching workflow ---------- */
document.addEventListener("click",event=>{
  const button=event.target.closest("button[data-action]");
  if(!button||button.disabled)return;
  const action=button.dataset.action,s=current();
  if(action==="language"){
    lang=lang==="zh"?"en":"zh";buildUI();$("language").focus();return;
  }
  if(action==="presentation"){
    presentation=!presentation;document.body.classList.toggle("presentation",presentation);
    buildUI();$("presentation").focus();return;
  }
  if(action==="tab"){
    pauseCurrent();active=Number(button.dataset.id);
    if(current().status==="running")current().status="paused";
    accumulator=0;buildUI();announce(tr("announceTab"));
    document.querySelector(`.tab[data-id="${active}"]`).focus();return;
  }
  if(action==="guided"||action==="explore"){
    mode=action;buildUI();announce(tr("announceMode"));$(action).focus();return;
  }
  if(action==="predict"){
    if(mode!=="guided"||s.prediction!==null||s.launched)return;
    s.prediction=Number(button.dataset.id);
    s.records.push({round:s.round,choice:s.prediction,conditions:{...s.p}});
    syncUI();announce(tr("announcePrediction"));$("play").focus();return;
  }
  if(action==="play"){
    if(s.status==="running"){
      s.status="paused";accumulator=0;
    }else if(s.status==="paused"){
      s.status="running";accumulator=0;
    }else if(canStart(s)){
      initialise(s);accumulator=0;
    }
    syncUI();renderGraphics();announce(I18N[lang].states[displayState(s)]);return;
  }
  if(["reset","edit","defaults"].includes(action)){
    resetState(active,action==="defaults");accumulator=0;buildUI();
    announce(tr("announceReset"));
    if(action==="edit")document.querySelector("[data-input]")?.focus();
    else document.querySelector(`[data-action="${action}"]`)?.focus();
    return;
  }
  if(action==="inward"||action==="outward"){
    const target=cmToM(action==="inward"?CONFIG.radius.min:CONFIG.radius.max);
    if(!s.launched){
      changeInitial(s,"r",target);current().target=target;
    }else setWeightTarget(s,target);
    $("input-target").value=target*100;
    syncUI();renderGraphics();announce(tr("announceTarget"));return;
  }
  if(action==="brake"){
    if(s.launched)s.p.brake=!s.p.brake;
    else changeInitial(s,"brake",!s.p.brake);
    syncUI();renderGraphics();announce(tr("announceBrake"));return;
  }
  if(action==="quiz"&&s.observed){
    s.quiz=Number(button.dataset.id);s.quizMode=mode;
    syncUI();announce(tr(mode==="explore"?"exploreFinished":"answerSaved"));return;
  }
});
document.addEventListener("input",event=>{
  const input=event.target.closest("[data-input]");
  if(!input||input.disabled)return;
  const key=input.dataset.input,s=current();
  let value=Number(input.value);
  if(["rA","rB","r","target"].includes(key))value=cmToM(value);
  if(key==="target"){
    if(s.launched)setWeightTarget(s,value);
    else{changeInitial(s,"r",value);current().target=value;}
  }else if(s.id===2&&key==="torque"&&s.launched){
    s.p.torque=value;
  }else if(!s.launched){
    changeInitial(s,key,value);
  }
  syncUI();renderGraphics();
});
document.addEventListener("change",event=>{
  if(event.target.matches('[data-input="target"]'))announce(tr("announceTarget"));
});
document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&presentation){
    presentation=false;document.body.classList.remove("presentation");buildUI();$("presentation").focus();
  }
});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    if(pauseCurrent()){syncUI();announce(tr("announceHidden"));}
    accumulator=0;lastWall=null;
  }else{lastWall=null;accumulator=0;syncUI();}
});
window.addEventListener("resize",()=>renderGraphics());

/* ---------- One fixed-timestep animation loop ---------- */
let lastWall=null,accumulator=0,lastUI=0,observedRendered=false;
function frame(wall){
  if(lastWall===null)lastWall=wall;
  const delta=Math.min(CONFIG.maxWallDelta,Math.max(0,(wall-lastWall)/1000));
  lastWall=wall;
  const s=current(),before=s.status,wasObserved=s.observed;
  if(!document.hidden&&s.status==="running"){
    accumulator+=delta;
    while(accumulator+CONFIG.epsilon>=CONFIG.fixedStep&&s.status==="running"){
      advanceSimulation(s,CONFIG.fixedStep);
      accumulator-=CONFIG.fixedStep;
    }
    if(s.status!=="running")accumulator=0;
  }else accumulator=0;
  if(wall-lastUI>=CONFIG.uiInterval*1000||before!==s.status||wasObserved!==s.observed){
    syncUI();lastUI=wall;
  }
  if(before==="running"&&s.status==="complete")announce(I18N[lang].states.complete);
  if(!document.hidden)renderGraphics();
  requestAnimationFrame(frame);
}

/* ---------- Isolated physics and state self-tests ---------- */
function runPhysicsSelfTests(){
  let passed=0,failed=0;
  const near=(a,b,tol=CONFIG.testTolerance)=>Math.abs(a-b)<=tol*Math.max(1,Math.abs(a),Math.abs(b));
  const test=(name,fn)=>{
    try{
      if(!fn())throw new Error("Assertion returned false");
      passed++;
    }catch(error){
      failed++;console.error(`[Physics self-test] ${name}:`,error);
    }
  };
  const clone=o=>JSON.parse(JSON.stringify(o));
  test("1. Moment-of-inertia formula",()=>near(moment(.05,.10,.02,.03),.5*.10*.02**2+2*.03*.05**2));
  test("2. Equal total mass; larger radius gives larger I",()=>totalMass()===CONFIG.hubMass+2*CONFIG.weightMass&&moment(.05)>moment(.02));
  test("3. I × omega equals fixed L at different radii",()=>[.015,.03,.06].every(r=>near(moment(r)*angularSpeed(.012,moment(r)),.012)));
  test("4. Halving I doubles angular speed",()=>near(angularSpeed(.02,.004/2),2*angularSpeed(.02,.004)));
  test("5. No braking preserves L and omega",()=>{
    const x=brakeSegment(.02,.003,0,21);
    return near(x.L,.02)&&near(x.w,.02/.003)&&near(x.angle,.02/.003*21);
  });
  test("6. Constant braking law and zero clamp",()=>near(momentumAt(.01,.0004,7),.0072)&&momentumAt(.01,.0004,30)===0);
  test("7. Stopping time",()=>near(stopTime(.0002,40,.0005),16));
  test("8. Stops without reversal; exact stop-angle integration",()=>{
    const x=brakeSegment(.01,.001,.002,20);
    return x.L===0&&x.w===0&&near(x.used,5)&&near(x.angle,25)&&brakeSegment(0,.001,.002,20).angle===0;
  });
  test("9. Larger I means longer stopping time under equal controls",()=>stopTime(moment(.055),50,.00045)>stopTime(moment(.03),50,.00045));
  test("10. Removing braking retains L; stopped device cannot restart",()=>{
    const reduced=brakeSegment(.01,.001,.001,3);
    const coast=brakeSegment(reduced.L,.001,0,8);
    const rest=brakeSegment(0,.001,0,8);
    return near(coast.L,reduced.L)&&near(coast.w,reduced.w)&&rest.L===0&&rest.w===0;
  });
  test("11. SI conversions",()=>near(gToKg(80),.08)&&near(cmToM(5.5),.055)&&near(revToRad(6),12*Math.PI));
  test("12. Pause freezes time, angles, history and radius",()=>{
    const local=makeState(1,CONFIG.defaults.conserve);
    initialise(local);setWeightTarget(local,.02);local.status="paused";
    const snapshot=JSON.stringify(local);
    advanceSimulation(local,3);
    return snapshot===JSON.stringify(local);
  });
  test("13a. Braking is independent of update partition, including stopping",()=>{
    const simulate=steps=>{
      let L=.008,angle=0;
      for(const dt of steps){const x=brakeSegment(L,.00017,.00045,dt);L=x.L;angle+=x.angle;}
      return {L,angle};
    };
    const a=simulate([25]),b=simulate(Array(750).fill(25/750)),c=simulate(Array(3000).fill(25/3000));
    return near(a.L,b.L)&&near(a.L,c.L)&&near(a.angle,b.angle,1e-8)&&near(a.angle,c.angle,1e-8);
  });
  test("13b. Moving weights: fixed-step updates at 30, 60 and 120 fps agree",()=>{
    const simulate=fps=>{
      const local=makeState(1,CONFIG.defaults.conserve);
      initialise(local);setWeightTarget(local,.02);
      let acc=0;
      for(let f=0;f<fps*3;f++){
        acc+=1/fps;
        while(acc+CONFIG.epsilon>=CONFIG.fixedStep){advanceSimulation(local,CONFIG.fixedStep);acc-=CONFIG.fixedStep;}
      }
      return local;
    };
    const a=simulate(30),b=simulate(60),c=simulate(120);
    return ["t","r","w","L"].every(k=>near(a[k],b[k])&&near(a[k],c[k]))&&
      near(a.theta[0],b.theta[0])&&near(a.theta[0],c.theta[0])&&
      JSON.stringify(a.history)===JSON.stringify(b.history)&&JSON.stringify(a.history)===JSON.stringify(c.history);
  });
  test("14. Target change never changes launch angular momentum",()=>{
    const local=makeState(1,CONFIG.defaults.conserve);
    initialise(local);const L=local.L0;setWeightTarget(local,.015);
    for(let i=0;i<240;i++)advanceSimulation(local,CONFIG.fixedStep);
    return local.L0===L&&local.L===L&&near(moment(local.r)*local.w,L);
  });
  test("15. Comparison ends at exact later stopping time",()=>{
    const local=makeState(0,CONFIG.defaults.compare);initialise(local);
    for(let i=0;i<10000&&local.status==="running";i++)advanceSimulation(local,CONFIG.fixedStep);
    const expected=Math.max(stopTime(moment(local.p.rA),revToRad(local.p.speed),local.p.torque),stopTime(moment(local.p.rB),revToRad(local.p.speed),local.p.torque));
    return near(local.t,expected)&&local.wA===0&&local.wB===0&&local.status==="complete";
  });
  test("16. History is bounded",()=>{
    const local=makeState(2,{...CONFIG.defaults.brake,brake:false});initialise(local);
    for(let i=0;i<CONFIG.maxSamples+200;i++){local.t=i*.1;appendSample(local);}
    return local.history.length<=CONFIG.maxSamples;
  });
  test("17. Test-state changes do not touch live experiment states",()=>{
    const snapshot=JSON.stringify(states);
    const local=clone(makeState(1,CONFIG.defaults.conserve));
    initialise(local);setWeightTarget(local,.02);advanceSimulation(local,.1);
    return JSON.stringify(states)===snapshot;
  });
  if(failed===0)console.info(`[Physics self-tests] ${passed} passed.`);
  else console.error(`[Physics self-tests] ${failed} failed; ${passed} passed.`);
  return {passed,failed};
}

runPhysicsSelfTests();
buildUI();
requestAnimationFrame(frame);
</script>
